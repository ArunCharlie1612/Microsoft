[project]
name = "breachsim-backend"
version = "1.0.0"
description = "BreachSim — Agentic Red Team Swarm orchestrator"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]  # FastAPI Depends in defaults

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
